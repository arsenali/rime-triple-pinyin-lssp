# encoding: utf-8

# Rime custom settings for Triple_pinyin
translator:
  # preedit_format 輸入碼->上屏碼  第2步：詞典編碼->上屏碼：全拼/拼音/注音/國羅
  preedit_format_2_pinyin_to_quanpin:   # 輸入碼->上屏碼  第2步：詞典編碼->上屏碼：漢語拼音全拼
   __patch: &gyf                # 2.1  隔音符處理
    __append:
    - xform/'/"/                                            # 輸入的隔音符號'變換為"
    - xform/ (\S+-)/ '$1/                                   # 李氏三拼簡拼前+隔音符
    - xform/(\S+-) /$1' /                                   # 簡拼後+隔音符
    - xform/ ([bpmdtnlgkhr]|[zcs]h?|[\w´]\x2F\w)\>/ '$1/    # 廿六三拼簡拼前+隔音符
    - xform/\<([bpmdtnlgkhr]|[zcs]h?|[\w´]\x2F\w) /$1' /    # 簡拼後+隔音符
    - xform/' '?/ '/
   __patch:                     # 2.2  全碼處理：漢語拼音全拼（去掉聲調）
    __append:
    - xform/([iuvyw])E-/$1e-/                               # 簡拼處理：ie/ue/ve，用e（ㄜ）/eh（ê/ㄝ）
    - xform/eh-/ê-/                                         # 若([iuvyw])E-使用eh-，則轉換為ê-
    - xform/\<([jqx])v(\w*)-/$1u$2-/                        # [jqx]v- => u-
    - xform/v(\w*)-/ü$1-/                                   # v- => ü-
    - xform/ ([aoe])/ '$1/                                  # 全碼處理：零聲母音節前+隔音符
    - xform/zii/ji/                                         # 尖音處理
    - xform/z(i[a-z]+)/j$1/
    - xform/zv([a-z]*)/ju$1/
    - xform/cii/qi/
    - xform/c(i[a-z]+)/q$1/
    - xform/cv([a-z]*)/qu$1/
    - xform/sii/xi/
    - xform/s(i[a-z]+)/x$1/
    - xform/sv([a-z]*)/xu$1/
    - xform/v([a-z]+)/u$1/                                  # v[a-z]+ => u
    - xform/[0-5]//                                         # 去掉聲調
    
   __patch:                     # 2.3  空格處理
    __append:
    - xform/(?<!-) '(?!\S*-)/ /                             # 保留空格，刪除零聲母音節前的隔音符
    # - xform/ //                                             # 刪除空格
    
    - xlit|;"| '|                                           # 把;替換為空格，恢復輸入的隔音符號'

  preedit_format_2_pinyin_to_ddpy:      # 輸入碼->上屏碼  第2步：詞典編碼->上屏碼：帶調拼音
   __patch: *gyf                # 2.1  隔音符處理
   __patch:                     # 2.2  全碼處理：帶調拼音
    __append:
    - xform/([iuvyw])E-/$1e-/                               # 簡拼處理：ie/ue/ve，用e（ㄜ）/eh（ê/ㄝ）
    - xform/\<([jqx])v(\w*)-/$1u$2-/                        # [jqx]v- => u-
    - xform/ ([aoe])/ '$1/                                  # 全碼處理：零聲母音節前+隔音符
    - xform/([aoeiuv])(ng?|r)([1-4])/$1$3$2/                # 聲調轉換
    - xform/([aoe])([iuoe])([1-4])/$1$3$2/
    - xform/a1/ā/
    - xform/a2/á/
    - xform/a3/ǎ/
    - xform/a4/à/
    - xform/e1/ē/
    - xform/e2/é/
    - xform/e3/ě/
    - xform/e4/è/
    - xform/o1/ō/
    - xform/o2/ó/
    - xform/o3/ǒ/
    - xform/o4/ò/
    - xform/i1/ī/
    - xform/i2/í/
    - xform/i3/ǐ/
    - xform/i4/ì/
    - xform/u1/ū/
    - xform/u2/ú/
    - xform/u3/ǔ/
    - xform/u4/ù/
    - xform/v1/ǖ/
    - xform/v2/ǘ/
    - xform/v3/ǚ/
    - xform/v4/ǜ/
    - xform/eh1/ê̄/
    - xform/eh2/ế/
    - xform/eh3/ê̌/
    - xform/eh4/ề/
    - xform/eh[05]?/ê/
    - xform/v/ü/
    - xform/[05]//                                          # 未處理聲調轉換
    
   __patch:                     # 2.3  空格處理
    __append:
    - xform/(?<!-) '(?!\S*-)/ /                             # 保留空格，刪除零聲母音節前的隔音符
    # - xform/ //                                             # 刪除空格
    
    - xlit|;"| '|                                           # 把;替換為空格，恢復輸入的隔音符號'

  preedit_format_2_pinyin_to_zhuyin:    # 輸入碼->上屏碼  第2步：詞典編碼->上屏碼：注音符號
   __patch: *gyf                # 2.1  隔音符處理
   __patch:                     # 2.2  全碼處理：注音符號
    __append:
    - xform/([iuvyw])E-/$1eh-/                              # 簡拼處理：ie/ue/ve，用e（ㄜ）/eh（ê/ㄝ）
    - xform/\<yur-/yua-/
    - xform/\<([a-z]|[zcs]h)(\x2F)([a-z])/$1$3/
    - xform/´\x2Fyw-/〇-/
    - xform/´\x2Fx/〇x/
    - xform/([jqx])u/$1v/                                   # 全碼處理：拼音完整形式、異拼
    - xform/iu/iou/
    - xform/ui/uei/
    - xform/ong/ung/
    - xform/yi?/i/
    - xform/wu?/u/
    - xform/iu/v/
    - xform/([iuv])n/$1en/
    - xform/zh/Z/
    - xform/ch/C/
    - xform/sh/S/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iuv])e(?!-)([0-5]|\>)/$1E$2/
    - xform/([iu])ee/$1e/
    - xform/([ZCSrzcs])i(i|[0-5]|\>)/$1$2/
    - xlit/bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR12345/ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙/
    - xform/([^ˉˊˇˋ˙']) (?!')/$1 '/                         # 無聲調後+隔音符
    - xform/0//                                             # 未標調音節處理：刪除
    - xform/(ˉ|ˊ|ˇ|ˋ|˙) '(?!\S*-)/$1 /                      # 聲調符號後去掉隔音符
    
   __patch:                     # 2.3  空格處理
    __append:
    # - xform/(?<!-) '(?!\S*-)/ /                             # 保留空格，刪除零聲母音節前的隔音符
    - xform/ //                                             # 刪除空格
    
    - xlit|;"| '|                                           # 把;替換為空格，恢復輸入的隔音符號'

  preedit_format_2_pinyin_to_guoluo:    # 輸入碼->上屏碼  第2步：詞典編碼->上屏碼：國語羅馬字
   __patch: *gyf                # 2.1  隔音符處理
   __patch:                     # 2.2  全碼處理：國語羅馬字
    __append:
    - xform/([iuvyw])E-/$1e-/                               # 簡拼處理：ie/ue/ve，用e（ㄜ）/eh（ê/ㄝ）
    - xform/eh([0-5-])\>/E$1/                               # 對單韻母音節eh（ê/ㄝ），《國語羅馬字拼音法式》第4頁規定：ㄜ、ㄝ可同用e母；若在分別表明ㄜ與ㄝ兩音時，ㄝ可作ê
    - xform/([iuyw])ee([0-5])\>/$1e$2/                      # iee/uee拼寫和ie/ue一致
    
    - xform/\<([^mnlr])(?!h)([a-z]+)0?\>/$1$2\x31/          # 未標調音節處理：非mnlr開頭的音節轉換為1聲
    - xform/\<([zcs]h[a-z]+|[aoe])0?\>/$1\x31/
    - xform/\<([mnlr][a-z]+)0?\>/$1\x32/                    # 未標調音節處理：mnlr開頭的音節轉換為2聲
    
    - xform/\<([jqx])u([a-z]*[1-5])\>/$1v$2/                # [jqx]u => v
    
    - xform/\<(\w*[^r][1-4]) er5/$1L/                       # 疊詞規則
    - xform/\<(\w+[1-5] \w+[1-5]) \1( |\>)/$1 VX$2/
    - xform/\<(\w+[1-5]) (\w+[1-5]) \1( |\>)/$1 $2 V$3/
    - xform/\<(\w+[1-5]) \1( |\>)/$1 X$2/
    - xform/L/ er5/
    
    - xform/([uv])i([1-4]) er5/$1ei$2 er5/                  # 兒化音處理1
    - xform/([iuv])n([1-4]) er5/$1en$2 er5/
    - xform/(?<![iuvyw])([eE])([1-4]) er5/$1$2 l er5/       # 以e/ê結尾的音節打標記
    - xform/ye([1-2]) er5/ye$1 l er5/
    - xform/(\w*)ie([1-2]) er5/$1ie$2 l er5/
    - xform/(yu|w)e([1-2]) er5/$1e$2 l er5/
    - xform/(\w*)ve([1-2]) er5/$1ve$2 l er5/
    - xform/([ae])i([1-4]) er5/$1$2 er5/                    # 音節末尾的i失落
    - xform/([ae])n([1-4]) er5/$1$2 er5/                    # 音節末尾的n失落
    - xform/([zcs]h?|r)i([1-4]) er5/$1e$2 er5/              # 空韻後需要加上el
    - xform/yie?([1-4]) er5/ye$1 er5/                       # 韻母i後需要加上el
    - xform/ii?([1-4]) er5/ie$1 er5/                        # 韻母i後需要加上el
    - xform/(v|yu)([1-4]) er5/$1e$2 er5/                    # 韻母v後需要加上el
    
    - xform/([zcsrh])i([1-5])\>/$1Y$2/                      # 全碼處理：音節轉換规则
    - xform/\<er(\w*[1-5])\>/el$1/
    - xform/\<zh(\w+[1-5])?\>/j$1/
    - xform/\<z([aoeEiuvY]\w*[1-5])?\>/tz$1/
    - xform/\<c([aoeEiuvY]\w*[1-5])?\>/ts$1/
    - xform/\<q(\w+[1-5])?\>/ch$1/
    - xform/\<x(\w+[1-5])?\>/sh$1/
    - xform/iu([1-5])\>/iou$1/
    - xform/([uv])i([1-5])\>/$1ei$2/
    - xform/ao([1-5])\>/au$1/
    - xform/([^y])un(g?[1-5])\>/$1uen$2/
    - xform/v(\w*[1-5])\>/iu$1/
    - xform/\<wu([1-5])\>/u$1/
    - xform/\<y(\w+[1-5]|ι)\>/i$1/
    - xform/\<w(\w+[1-5]|ι)\>/u$1/
    - xform/ii(\w*[1-5])\>/i$1/
    - xform/\<([mnlr]\w+)2\>/$1/
    - xform/\<([mnlr])(\w+1)\>/$1h$2/
    - xform/1\>//
    - xform/i(\w+)2\>/y$1/
    - xform/u(\w+)2\>/w$1/
    - xform/([aoeE])([iu])?2\>/$1$2r/
    - xform/([aoe])([nl]|ng)2\>/$1r$2/
    - xform/i2\>/yi/
    - xform/u2\>/wu/
    - xform/\<ie(i)?3\>/yee$1/
    - xform/\<uo3\>/woo/
    - xform/\<i(\w*3)\>/yi$1/
    - xform/\<u(\w*3)\>/wu$1/
    - xform/ie3\>/iee/
    - xform/i(ng?)3\>/ii$1/
    - xform/i([aou]\w*)3\>/e$1/
    - xform/([^w])u(o\w*)3\>/$1uo$2/
    - xform/u([aoe]\w*)3\>/o$1/
    - xform/ai3\>/ae/
    - xform/au3\>/ao/
    - xform/([aoeE])([iunl]|ng)?3\>/$1$1$2/
    - xform/i3\>/ii/
    - xform/u3\>/uu/
    - xform/\<i4\>/yih/
    - xform/\<iu4\>/yuh/
    - xform/\<u4\>/wuh/
    - xform/\<in4\>/yinn/
    - xform/\<ing4\>/yinq/
    - xform/\<i(\w+4)\>/y$1/
    - xform/\<u(\w+4)\>/w$1/
    - xform/([aoeE])4\>/$1h/
    - xform/([ao])u4\>/$1w/
    - xform/([ae])i4\>/$1y/
    - xform/u4\>/uh/
    - xform/i4\>/ih/
    - xform/n4\>/nn/
    - xform/l4\>/ll/
    - xform/ng4\>/nq/
    - xform/Y\>/y/
    - xform/Y2\>/yr/
    - xform/Y3\>/yy/
    - xform/Y4\>/yh/
    - xform/Y5\>/yV/
    - xform/5\>/V/
    - xform/\<(\w+)V\>/·$1/                                 # 輕聲
    
    - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwêrtyuiopasdfghjklzxcvbnm/
    
    - xform/\<([^·]*)h l ·el/$1'll/                         # 兒化音處理2
    - xform/\<([^·]*[^l]) l ·el/$1'l/
    - xform/\<([^·]*)h ·el/$1ll/
    - xform/\<([^·]*[^l]) ·el/$1l/
    
    - xform/·ba\>/b/                                        # 簡寫
    - xform/·tzy\>/tz/
    - xform/·men\>/mn/
    - xform/·([mdj])e\>/$1/                                 # 若韻母=e，則省去韻母
    - xform/·([nlg])e\>/·$1/
    - xform/(^|;)·([nlg])\>/$1$2/
    
    - xform/([^q']) ([aoeêu])/$1 '$2/                       # 隔音符
    - xform/([aeêiynl]) i/$1 'i/
    - xform/([gh]) w/$1 'w/
    - xform/([nlr]) h/$1 'h/
    - xform/([bzmdj]) '?/$1' /
    - xform/([bzmdj])' ([xv]\w?)([ ;']|\>)/$1 $2$3/
    - xform/'( )?·/$1·/                                     # 隔音符、輕聲符連寫時省去隔音符
    
   __patch:                     # 2.3  空格處理
    __append:
    # - xform/(?<!-) '(?!\S*-)/ /                             # 保留空格，刪除零聲母音節前的隔音符
    - xform/ //                                             # 刪除空格
    
    - xlit|;"| '|                                           # 把;替換為空格，恢復輸入的隔音符號'

  # comment_format 詞典編碼->提示碼：全拼/拼音/注音/國羅
  comment_format_copy1:         # 詞典編碼->提示碼：分兩段1
    - xform/(?<! )\<([a-z]+[0-5])\>/$1 \U$1\E/
    - xform/ \<([a-z]+[0-5])\>/ \U$1\E/
    - xform/\<([A-Z]+)0\>/$1０/
    - xform/\<([A-Z]+)1\>/$1１/
    - xform/\<([A-Z]+)2\>/$1２/
    - xform/\<([A-Z]+)3\>/$1３/
    - xform/\<([A-Z]+)4\>/$1４/
    - xform/\<([A-Z]+)5\>/$1５/
    - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/ＱＷＥＲＴＹＵＩＯＰＡＳＤＦＧＨＪＫＬＺＸＣＶＢＮＭ/
    
  comment_format_copy2:         # 詞典編碼->提示碼：分兩段2
    - xform/\<([a-z]{3})\>/\U$1\E/
    - xlit/ＱＷＥＲＴＹＵＩＯＰＡＳＤＦＧＨＪＫＬＺＸＣＶＢＮＭ０１２３４５/qwertyuiopasdfghjklzxcvbnm012345/
    - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/ＱＷＥＲＴＹＵＩＯＰＡＳＤＦＧＨＪＫＬＺＸＣＶＢＮＭ/
    
  comment_format_copy3:         # 詞典編碼->提示碼：分兩段3
    - xlit/ＱＷＥＲＴＹＵＩＯＰＡＳＤＦＧＨＪＫＬＺＸＣＶＢＮＭ/qwertyuiopasdfghjklzxcvbnm/
    
  comment_format_pinyin_to_quanpin:     # 詞典編碼->提示碼 第二段：漢語拼音全拼
   # 音節轉換
    - erase/\<xx\>/
    - xform/\<m([0-5])\>/mu$1/                              # 鼻音m（呣）轉化爲mu
    - xform/\<r5\>/er5/                                     # r5（兒）轉化爲er5
    - xform/\<(ung|ong)([0-5])\>/weng$2/                    # 拼音完整形式、異拼
    - xform/\<([jqx])ung([0-5])\>/$1iong$2/
    - xform/ung/ong/
    - xform/vng/iong/
    - xform/eh/ê/                                           # eh特別處理，轉換為eh/e/ê
    - xform/ ([aoe])/ '$1/                                  # 音節轉換：零聲母音節前+隔音符
    - xform/zii([0-5])/ji$1/                                # 尖音處理
    - xform/z(i[a-z]+[0-5])/j$1/
    - xform/zv([a-z]*[0-5])/ju$1/
    - xform/cii([0-5])/qi$1/
    - xform/c(i[a-z]+[0-5])/q$1/
    - xform/cv([a-z]*[0-5])/qu$1/
    - xform/sii([0-5])/xi$1/
    - xform/s(i[a-z]+[0-5])/x$1/
    - xform/sv([a-z]*[0-5])/xu$1/
    - xform/v([a-z]+[0-5])/u$1/                             # v[a-z]+ => u
    - xform/([a-z|ü]+)[0-5]/$1/                             # 去掉聲調
    
   # 空格處理
    - xform/ '/ /                                           # 保留空格，刪除零聲母音節前的隔音符
    # - xform/ //                                             # 刪除空格

  comment_format_pinyin_to_ddpy:        # 詞典編碼->提示碼 第二段：帶調拼音
   # 音節轉換
    - erase/\<xx\>/
    - xform/\<m([0-5])\>/mu$1/                              # 鼻音m（呣）轉化爲mu
    - xform/\<r5\>/er5/                                     # r5（兒）轉化爲er5
    - xform/\<(ung|ong)([0-5])\>/weng$2/                    # 拼音完整形式、異拼
    - xform/\<([jqx])ung([0-5])\>/$1iong$2/
    - xform/ung/ong/
    - xform/vng/iong/
    - xform/ ([aoe])/ '$1/                                  # 音節轉換：零聲母音節前+隔音符
    - xform/([aoeiuv])(ng?|r)([1-4])/$1$3$2/                # 聲調轉換
    - xform/([aoe])([iuoe])([1-4])/$1$3$2/
    - xform/a1/ā/
    - xform/a2/á/
    - xform/a3/ǎ/
    - xform/a4/à/
    - xform/e1/ē/
    - xform/e2/é/
    - xform/e3/ě/
    - xform/e4/è/
    - xform/o1/ō/
    - xform/o2/ó/
    - xform/o3/ǒ/
    - xform/o4/ò/
    - xform/i1/ī/
    - xform/i2/í/
    - xform/i3/ǐ/
    - xform/i4/ì/
    - xform/u1/ū/
    - xform/u2/ú/
    - xform/u3/ǔ/
    - xform/u4/ù/
    - xform/v1/ǖ/
    - xform/v2/ǘ/
    - xform/v3/ǚ/
    - xform/v4/ǜ/
    - xform/eh1/ê̄/
    - xform/eh2/ế/
    - xform/eh3/ê̌/
    - xform/eh4/ề/
    - xform/eh[05]/ê/
    - xform/v/ü/
    - xform/([a-z|ü]+)[0-5]/$1/                             # 未處理聲調轉換
    
   # 空格處理
    - xform/ '/ /                                           # 保留空格，刪除零聲母音節前的隔音符
    # - xform/ //                                             # 刪除空格

  comment_format_pinyin_to_zhuyin:      # 詞典編碼->提示碼 第二段：注音符號
   # 音節轉換
    - erase/\<xx\>/
    - xform/\<m([0-5])\>/mu$1/                              # 鼻音m（呣）轉化爲mu
    - xform/\<r5\>/er5/                                     # r5（兒）轉化爲er5
